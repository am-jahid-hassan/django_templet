[pytest]
DJANGO_SETTINGS_MODULE = my_django.settings
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
testpaths = tests
addopts = --ignore=my_test -v --strict-markers -p no:warnings
markers =
    unit: Unit tests for models, services, utilities, and throttles
    integration: Integration tests for middleware, cache, and celery tasks
    api: API endpoint tests for authentication, otp, notifications, and health
    workflow: End-to-end multi-step user journey workflows
    security: Security and authorization constraint tests
